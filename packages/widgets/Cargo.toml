[package]
name = "hydrated-widgets"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde-json = { package = "serde_json", version = "1" }
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "Window",
    "console",
    "ImageData",
    "Performance",
    "CssStyleDeclaration",
] }
# Shared charting + quant computation crates (dogfooded WyattAu/plychart).
# Git deps so CI and any machine can build; pin by rev when needed.
plycore = { git = "https://github.com/WyattAu/plychart", package = "plycore" }
plychart = { git = "https://github.com/WyattAu/plychart", package = "plychart" }
plycompute = { git = "https://github.com/WyattAu/plychart", package = "plycompute" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
getrandom = { version = "0.2", features = ["js"] }
proptest = "1"

[[bench]]
name = "quant_benchmarks"
harness = false
