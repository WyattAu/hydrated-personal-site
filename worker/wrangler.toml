name = "hydrated-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

# KV namespace for guestbook (configure after first deploy)
# [[kv_namespaces]]
# binding = "GUESTBOOK"

[[kv_namespaces]]
binding = "AURORA_HISTORY"
id = "0b46da33092a4d598f7a19054c7d636e"

# [[kv_namespaces]]
# binding = "GUESTBOOK"
# id = "xxx"

# Durable Object for WebSocket price streaming
# Uncomment after creating the DO class in Cloudflare dashboard
# [[durable_objects.bindings]]
# name = "PRICE_STREAM"
# class_name = "PriceStream"

[triggers]
crons = ["*/30 * * * *"]
