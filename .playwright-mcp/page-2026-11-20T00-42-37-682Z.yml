      - paragraph [ref=f8e88]: 001 — About
      - generic [ref=f8e89]:
        - heading "Systems thinker, infrastructure builder." [level=2] [ref=f8e90]
        - paragraph [ref=f8e91]: UK-based backend and DevOps engineer with 6 years of experience building reproducible infrastructure, CI/CD pipelines, and high-performance systems. I architect solutions that stay standing after the next "must-have feature" ships to production.
        - paragraph [ref=f8e92]: My work spans distributed systems, real-time data pipelines, developer experience tooling, and security-focused sandboxing. I believe in deterministic builds, modular architecture, and infrastructure that can be reasoned about.
        - paragraph [ref=f8e93]: Currently focused on WebAssembly-powered developer tools and infrastructure automation through QuestHive. When not shipping code, I'm probably debugging a CI pipeline or contributing to open-source projects that solve real problems.
