              - paragraph [ref=f7e280]: S_N(t) = sum_n a_n * sin(n * w * t + phi_n)
              - paragraph [ref=f7e281]: "Sine: a_1 = 1, all other a_n = 0."
              - paragraph [ref=f7e282]: "Truncating the series at N leaves an RMS (L2) error that shrinks as N grows; smooth targets (sine, triangle) converge fastest. Near a jump discontinuity the partial sums overshoot by about 8.9% no matter how large N gets. This is the Gibbs phenomenon: the overshoot narrows but never disappears."
