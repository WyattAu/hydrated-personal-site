# ─── GitHub Trending ───────────────────────────────────────────

[[endpoint]]
id = "GITHUB-TRENDING-001"
method = "GET"
path = "/api/github-trending"
description = "GitHub trending repositories"
cache_ttl = 1800
error_codes = [502]
external_api = "GitHub Trending (scraped)"

[endpoint.params]
language = { type = "string", required = false, description = "Programming language filter" }
since = { type = "string", required = false, default = "daily", enum = ["daily", "weekly", "monthly"] }

[endpoint.response]
status = 200
schema = """
[{ "name": string, "url": string, "description": string, "language": string, "stars": number, "forks": number, "todayStars": number }]
"""

[endpoint.errors]
502 = "Upstream API error (GitHub)"

# ─── LLM Benchmarks ───────────────────────────────────────────

[[endpoint]]
id = "LLM-BENCHMARKS-001"
method = "GET"
path = "/api/llm-benchmarks"
description = "LLM benchmark data from Artificial Analysis"
cache_ttl = 21600
error_codes = [502]
external_api = "https://api.artificialanalysis.ai"

[endpoint.params] = {}

[endpoint.response]
status = 200
schema = """
[{ "model": string, "provider": string, "scores": { [benchmark: string]: number }, "price": number, "speed": number }]
"""

[endpoint.errors]
502 = "Upstream API error (Artificial Analysis)"

# ─── Guestbook ─────────────────────────────────────────────────

[[endpoint]]
id = "GUESTBOOK-GET-001"
method = "GET"
path = "/api/guestbook"
description = "List guestbook entries"
cache_ttl = 0
error_codes = [500]

[endpoint.params]
limit = { type = "number", required = false, default = 20, description = "Entries per page" }
offset = { type = "number", required = false, default = 0, description = "Pagination offset" }

[endpoint.response]
status = 200
schema = """
{ "entries": [{ "id": string, "name": string, "message": string, "timestamp": number }], "total": number }
"""

[endpoint.errors]
500 = "KV storage error"

[[endpoint]]
id = "GUESTBOOK-POST-001"
method = "POST"
path = "/api/guestbook"
description = "Create guestbook entry"
cache_ttl = 0
error_codes = [400, 413, 429]

[endpoint.params]
name = { type = "string", required = true, max_length = 50, description = "Display name" }
message = { type = "string", required = true, max_length = 500, description = "Message content" }
honeypot = { type = "string", required = true, must_be = "", description = "Must be empty (anti-spam)" }

[endpoint.response]
status = 201
schema = """
{ "id": string, "name": string, "message": string, "timestamp": number }
"""

[endpoint.errors]
400 = "Validation error (missing fields, invalid data)"
413 = "Message too long (max 500 chars)"
429 = "Rate limit exceeded (5 requests per 10 minutes per IP)"

[[endpoint]]
id = "GUESTBOOK-DELETE-001"
method = "DELETE"
path = "/api/guestbook/:id"
description = "Delete guestbook entry (admin only)"
cache_ttl = 0
error_codes = [401, 404]

[endpoint.params]
id = { type = "string", required = true, location = "path", description = "Entry ID" }
authorization = { type = "string", required = true, location = "header", description = "Bearer token" }

[endpoint.response]
status = 200
schema = """
{ "deleted": true }
"""

[endpoint.errors]
401 = "Unauthorized (invalid or missing bearer token)"
404 = "Entry not found"

# ─── Exchange Rates ────────────────────────────────────────────

[[endpoint]]
id = "EXCHANGE-RATES-001"
method = "GET"
path = "/api/exchange-rates"
description = "Currency exchange rates"
cache_ttl = 3600
error_codes = [502]
external_api = "https://api.exchangerate-api.com"

[endpoint.params]
base = { type = "string", required = false, default = "USD", description = "Base currency" }

[endpoint.response]
status = 200
schema = """
{ "base": string, "rates": { [currency: string]: number }, "timestamp": number }
"""

[endpoint.errors]
502 = "Upstream API error (exchangerate-api)"

# ─── FRED ──────────────────────────────────────────────────────

[[endpoint]]
id = "FRED-001"
method = "GET"
path = "/api/fred"
description = "Federal Reserve Economic Data"
cache_ttl = 3600
error_codes = [400, 502]
external_api = "https://api.stlouisfed.org/fred/series/observations"

[endpoint.params]
series = { type = "string", required = true, description = "Series ID (e.g. GDP, UNRATE, CPIAUCSL)" }
limit = { type = "number", required = false, default = 100, description = "Number of observations" }

[endpoint.response]
status = 200
schema = """
{ "series": string, "data": [{ "date": string, "value": number }] }
"""

[endpoint.errors]
400 = "Invalid series ID"
502 = "Upstream API error (FRED)"

# ─── Vitals (RUM) ──────────────────────────────────────────────

[[endpoint]]
id = "VITALS-001"
method = "POST"
path = "/api/vitals"
description = "Real User Monitoring vitals collection"
cache_ttl = 0
error_codes = [400]

[endpoint.params]
ttfb = { type = "number", required = true, description = "Time to First Byte (ms)" }
lcp = { type = "number", required = true, description = "Largest Contentful Paint (ms)" }
cls = { type = "number", required = true, description = "Cumulative Layout Shift" }
inp = { type = "number", required = true, description = "Interaction to Next Paint (ms)" }
url = { type = "string", required = true, description = "Page URL" }

[endpoint.response]
status = 204
schema = ""

[endpoint.errors]
400 = "Invalid vitals data"
