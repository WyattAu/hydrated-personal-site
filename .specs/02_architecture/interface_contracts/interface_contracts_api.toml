schema = """
{ "earthquakes": [{ "id": string, "magnitude": number, "place": string, "time": number, "lat": number, "lng": number, "depth": number }] }
"""

[endpoint.errors]
502 = "Upstream API error (USGS)"

# ─── Fear & Greed ──────────────────────────────────────────────

[[endpoint]]
