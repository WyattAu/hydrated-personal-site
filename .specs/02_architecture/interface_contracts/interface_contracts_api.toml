# Interface Contracts — API Endpoints
# Hydrated Personal Site

version = "1.0.0"
base_url = "/api"
protocol = "HTTPS"
format = "JSON"

# ─── Health Check ──────────────────────────────────────────────

[[endpoint]]
id = "HEALTH-001"
method = "GET"
path = "/api/health"
description = "Health check endpoint"
params = {}
cache_ttl = 0
error_codes = []

[endpoint.response]
status = 200
schema = """
{ "status": "ok", "timestamp": number, "version": string }
"""

# ─── Weather ───────────────────────────────────────────────────

[[endpoint]]
id = "WEATHER-001"
method = "GET"
path = "/api/weather"
description = "Open-Meteo weather proxy"
cache_ttl = 300
error_codes = [400, 502, 429]
external_api = "https://api.open-meteo.com/v1/forecast"

[endpoint.params]
lat = { type = "number", required = true, description = "Latitude" }
lon = { type = "number", required = true, description = "Longitude" }
units = { type = "string", required = false, default = "celsius", enum = ["celsius", "fahrenheit"] }

[endpoint.response]
status = 200
schema = """
{ "temperature": number, "humidity": number, "windSpeed": number, "description": string, "icon": string }
"""

[endpoint.errors]
400 = "Missing required parameters (lat, lon)"
502 = "Upstream API error (Open-Meteo)"
429 = "Rate limit exceeded"

# ─── Stock Chart ───────────────────────────────────────────────

[[endpoint]]
id = "STOCK-CHART-001"
method = "GET"
path = "/api/stock-chart"
description = "Yahoo Finance chart data proxy"
cache_ttl = 120
error_codes = [400, 404, 502]
external_api = "https://query1.finance.yahoo.com/v8/finance/chart/"

[endpoint.params]
symbol = { type = "string", required = true, description = "Ticker symbol (e.g. AAPL, BTC-USD)" }
range = { type = "string", required = false, default = "1d", enum = ["1d", "5d", "1mo", "3mo", "6mo", "1y", "5y"] }
interval = { type = "string", required = false, default = "auto", enum = ["1m", "5m", "15m", "1h", "1d", "1wk"] }

[endpoint.response]
status = 200
schema = """
{ "symbol": string, "timestamps": number[], "opens": number[], "highs": number[], "lows": number[], "closes": number[], "volumes": number[] }
"""

[endpoint.errors]
400 = "Invalid symbol or parameters"
404 = "Symbol not found"
502 = "Upstream API error (Yahoo Finance)"

# ─── Crypto Ticker ─────────────────────────────────────────────

[[endpoint]]
id = "CRYPTO-TICKER-001"
method = "GET"
path = "/api/crypto-ticker"
description = "Binance crypto price proxy"
cache_ttl = 10
error_codes = [502]
external_api = "https://api.binance.com/api/v3/ticker/24hr"

[endpoint.params]
symbols = { type = "string", required = false, default = "BTCUSDT,ETHUSDT", description = "Comma-separated symbol list" }

[endpoint.response]
status = 200
schema = """
[{ "symbol": string, "price": number, "change": number, "changePercent": number, "volume": number, "timestamp": number }]
"""

[endpoint.errors]
502 = "Upstream API error (Binance)"

# ─── CoinGecko Global ──────────────────────────────────────────

[[endpoint]]
id = "COINGECKO-GLOBAL-001"
method = "GET"
path = "/api/coingecko-global"
description = "CoinGecko global market data"
cache_ttl = 300
error_codes = [502]
external_api = "https://api.coingecko.com/api/v3/global"

[endpoint.params] = {}

[endpoint.response]
status = 200
schema = """
{ "totalMarketCap": { "usd": number }, "totalVolume": { "usd": number }, "btcDominance": number, "activeCryptos": number }
"""

[endpoint.errors]
502 = "Upstream API error (CoinGecko)"

# ─── Earthquakes ───────────────────────────────────────────────

[[endpoint]]
id = "EARTHQUAKES-001"
