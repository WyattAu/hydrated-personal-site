# ─── Binance Klines ────────────────────────────────────────────

[[endpoint]]
id = "BINANCE-KLINES-001"
method = "GET"
path = "/api/binance-klines"
description = "Binance price history (klines)"
cache_ttl = 300
error_codes = [400, 502]
external_api = "https://api.binance.com/api/v3/klines"

[endpoint.params]
symbol = { type = "string", required = true, description = "Trading pair (e.g. BTCUSDT)" }
interval = { type = "string", required = false, default = "1d", enum = ["1m", "5m", "15m", "1h", "1d", "1wk"] }
limit = { type = "number", required = false, default = 100, description = "Max 1000" }

[endpoint.response]
status = 200
schema = """
[{ "openTime": number, "open": number, "high": number, "low": number, "close": number, "volume": number, "closeTime": number }]
"""

[endpoint.errors]
400 = "Invalid symbol or parameters"
502 = "Upstream API error (Binance)"

# ─── Hacker News ───────────────────────────────────────────────

[[endpoint]]
id = "HACKER-NEWS-001"
method = "GET"
path = "/api/hacker-news"
