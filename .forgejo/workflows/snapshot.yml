name: Quarterly Dataset Snapshot

on:
  schedule:
    # First build of each quarter (Jan/Apr/Jul/Oct 1, 07:05 UTC)
    - cron: '5 7 1 1,4,7,10 *'
  workflow_dispatch: {}

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    name: Snapshot ETF database
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.11"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Snapshot dataset (idempotent per quarter)
        working-directory: apps/site
        run: bun scripts/snapshot-dataset.mjs

      - name: Commit snapshot if new
        run: |
          if [ -n "$(git status --porcelain apps/site/public/data/snapshots)" ]; then
            git config user.name "estate-agent"
            git config user.email "wyatt_au@protonmail.com"
            git add apps/site/public/data/snapshots
            git commit -m "data: quarterly etf-database snapshot ($(... date +%Y-Qn 2>/dev/null || date +%Y)-Q$(($(date +%-m)-1)/3+1))"
            git push
          else
            echo "no new snapshot this quarter"
          fi
