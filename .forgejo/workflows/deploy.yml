name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Skip pre-deploy validation gates
        required: false
        type: boolean
        default: false

# Never cancel an in-flight production deploy; queue instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Cloudflare deploys use API tokens, not the GitHub Pages OIDC chain.
permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun 1.3.11
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.11"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install worker dev deps
        run: bun install --frozen-lockfile
        working-directory: worker
      - name: Lint & format check
        run: bunx biome check .
      - name: Type check site
        # Run from apps/site so bunx resolves the workspace-pinned typescript
        # (5.x) rather than the latest from the public registry (6.x).
        run: bunx tsc --noEmit
        working-directory: apps/site
      - name: Type check worker
        run: bunx tsc --noEmit
        working-directory: worker
      - name: Run all tests
        run: bunx vitest run --coverage --pool=forks

  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/widgets
      - name: Install wasm-pack
        run: |
          curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh \
            | sh -s -- --force
      - name: Build WASM (stages into apps/site/public/wasm)
        run: bash packages/widgets/scripts/build.sh
      - name: Verify WASM output
        run: |
          test -f packages/widgets/pkg/hydrated_widgets_bg.wasm
          test -f apps/site/public/wasm/hydrated_widgets_bg.wasm
      - name: Upload WASM dist
        uses: actions/upload-artifact@v4
        with:
          name: wasm-dist
          path: apps/site/public/wasm/
          retention-days: 1

  build-site:
    name: Build Site
    runs-on: ubuntu-latest
    needs: [build-wasm]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun 1.3.11
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.11"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download WASM dist (staged into public)
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: apps/site/public/wasm
      - name: Build Astro site
        run: bunx astro build
        working-directory: apps/site
      - name: Verify build output
        run: |
          test -d apps/site/dist
          test -f apps/site/dist/index.html
          test -f apps/site/dist/wasm/hydrated_widgets_bg.wasm
      - name: Upload site dist
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: apps/site/dist/
          retention-days: 1

  # The Worker has no separate build step; wrangler bundles src/index.ts at
  # deploy time. This job exists to mirror the matrix and gate downstream
  # deploy on a successful typecheck of the worker package.
  verify-worker:
    name: Verify Worker types
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun 1.3.11
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.11"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install worker dev deps
        run: bun install --frozen-lockfile
        working-directory: worker
      - name: Typecheck
        run: bunx tsc --noEmit
        working-directory: worker

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [build-wasm, build-site, verify-worker]
    if: ${{ !inputs.skip_tests }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun 1.3.11
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.11"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download WASM dist
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: apps/site/public/wasm
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Run E2E tests
        run: bunx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy-pages:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [build-site, verify-worker]
    environment:
      name: production
      url: https://wyattau.com
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      - name: Deploy with Wrangler
        run: bunx wrangler@3 pages deploy dist --project-name=hydrated-site --branch=main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

  deploy-worker:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    needs: [verify-worker]
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun 1.3.11
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.11"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Deploy with Wrangler
        run: bunx wrangler@3 deploy
        working-directory: worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

  smoke-test:
    name: Post-Deploy Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy-pages, deploy-worker]
    timeout-minutes: 5
    steps:
      - name: Wait for edge propagation
        run: sleep 30
      - name: Probe homepage
        run: |
          for i in 1 2 3; do
            status=$(curl -sfL -o /dev/null -w '%{http_code}' https://wyattau.com/ || true)
            if [ "$status" -eq 200 ]; then echo "Homepage: OK"; exit 0; fi
            echo "Attempt $i failed (HTTP $status), retrying in 10s..."
            sleep 10
          done
          echo "Homepage: FAILED"
          exit 1
      - name: Probe API health
        run: |
          status=$(curl -sfL -o /dev/null -w '%{http_code}' https://wyattau.com/api/health || true)
          [ "$status" -eq 200 ] && echo "API Health: OK" || (echo "API Health: FAILED (HTTP $status)"; exit 1)
      - name: Probe crypto ticker
        run: |
          status=$(curl -sfL -o /dev/null -w '%{http_code}' https://wyattau.com/api/crypto-ticker || true)
          [ "$status" -eq 200 ] && echo "Crypto Ticker: OK" || (echo "Crypto Ticker: FAILED (HTTP $status)"; exit 1)
      - name: Probe world page
        run: |
          status=$(curl -sfL -o /dev/null -w '%{http_code}' https://wyattau.com/world || true)
          [ "$status" -eq 200 ] && echo "World Monitor: OK" || (echo "World Monitor: FAILED (HTTP $status)"; exit 1)
      - name: Probe ETF page
        run: |
          status=$(curl -sfL -o /dev/null -w '%{http_code}' https://wyattau.com/etf || true)
          [ "$status" -eq 200 ] && echo "ETF Page: OK" || (echo "ETF Page: FAILED (HTTP $status)"; exit 1)
