name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test suite'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Stage 1: Validate (reuses CI pipeline logic)
  validate:
    name: Validate
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@735343b667d3e6bfb3dd40e3b1db06b07838c21e
        with:
          version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint & format check
        run: bunx biome check .
      - name: Type check site
        run: bunx tsc --noEmit -p apps/site/tsconfig.json
      - name: Type check worker
        run: bunx tsc --noEmit -p worker/tsconfig.json
      - name: Run all tests
        run: bunx vitest run --coverage

  # Stage 2: Build all artifacts
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@00901f5853516d291e59569dd1a3af3c60828eba
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@9d401a67e2a3e761b73f17dd3f36ee6b0404091e
        with:
          workspaces: packages/widgets
      - uses: oven-sh/setup-bun@735343b667d3e6bfb3dd40e3b1db06b07838c21e
        with:
          version: latest
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build WASM
        run: wasm-pack build --target web --release packages/widgets
      - name: Verify WASM output
        run: ls -la packages/widgets/pkg/*.wasm
      - name: Upload WASM artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: wasm-dist
          path: packages/widgets/pkg/
          retention-days: 1

  build-site:
    name: Build Site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@735343b667d3e6bfb3dd40e3b1db06b07838c21e
        with:
          version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build Astro site
        run: bunx turbo build --filter=site
      - name: Verify build output
        run: ls -la apps/site/dist/
      - name: Upload site artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: site-dist
          path: apps/site/dist/
          retention-days: 1

  build-worker:
    name: Build Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@735343b667d3e6bfb3dd40e3b1db06b07838c21e
        with:
          version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build CF Worker
        run: bunx turbo build --filter=worker
      - name: Upload worker artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: worker-dist
          path: worker/dist/
          retention-days: 1

  # Stage 3: E2E Tests (if not skipped)
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [build-wasm, build-site, build-worker]
    timeout-minutes: 20
    if: ${{ !inputs.skip_tests }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@735343b667d3e6bfb3dd40e3b1db06b07838c21e
        with:
          version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright
        run: bunx playwright install --with-deps chromium
      - name: Run E2E tests
        run: bunx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Stage 4: Deploy to Cloudflare
  deploy-pages:
    name: Deploy to CF Pages
    runs-on: ubuntu-latest
    needs: [build-wasm, build-site, build-worker]
    environment:
      name: production
      url: https://wyattau.com
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e4f1e47a5a4d7ac0b9e6d724b
        with:
          name: site-dist
          path: dist
      - name: Deploy CF Pages
        run: npx wrangler pages deploy dist --project-name=hydrated-site
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

  deploy-worker:
    name: Deploy CF Worker
    runs-on: ubuntu-latest
    needs: [build-wasm, build-site, build-worker]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@735343b667d3e6bfb3dd40e3b1db06b07838c21e
        with:
          version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@fa0a91b85d4f404e4f1e47a5a4d7ac0b9e6d724b
        with:
          name: worker-dist
          path: worker/dist
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

  # Stage 5: Post-Deploy Smoke Test
  smoke-test:
    name: Post-Deploy Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy-pages, deploy-worker]
    timeout-minutes: 5
    steps:
      - name: Wait for deployment propagation
        run: sleep 30
      - name: Check homepage
        run: |
          for i in 1 2 3; do
            status=$(curl -sf -o /dev/null -w '%{http_code}' https://wyattau.com/ || true)
            if [ "$status" -eq 200 ]; then echo "Homepage: OK"; exit 0; fi
            echo "Attempt $i failed (HTTP $status), retrying in 10s..."
            sleep 10
          done
          echo "Homepage: FAILED"
          exit 1
      - name: Check API health
        run: |
          status=$(curl -sf -o /dev/null -w '%{http_code}' https://wyattau.com/api/health || true)
          [ "$status" -eq 200 ] && echo "API Health: OK" || (echo "API Health: FAILED (HTTP $status)"; exit 1)
      - name: Check crypto ticker
        run: |
          status=$(curl -sf -o /dev/null -w '%{http_code}' https://wyattau.com/api/crypto-ticker || true)
          [ "$status" -eq 200 ] && echo "Crypto Ticker: OK" || (echo "Crypto Ticker: FAILED (HTTP $status)"; exit 1)
      - name: Check world monitor page
        run: |
          status=$(curl -sf -o /dev/null -w '%{http_code}' https://wyattau.com/world || true)
          [ "$status" -eq 200 ] && echo "World Monitor: OK" || (echo "World Monitor: FAILED (HTTP $status)"; exit 1)
      - name: Check ETF page
        run: |
          status=$(curl -sf -o /dev/null -w '%{http_code}' https://wyattau.com/etf || true)
          [ "$status" -eq 200 ] && echo "ETF Page: OK" || (echo "ETF Page: FAILED (HTTP $status)"; exit 1)
