name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref. Keep one ongoing on main to avoid
# flapping artefact states during chained pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Reusable Bun install: forgejo-runner v6.3.1 cannot execute oven-sh/setup-bun
  # v2 (requires node24 runtime, runner only supports up to node20). Direct
  # curl install is portable across runner versions and avoids the action
  # runtime mismatch entirely.
  format:
    name: Biome Format & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun 1.3.11
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.11"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format & lint check
        run: bunx biome check .

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun 1.3.11
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.11"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Cloudflare workers-types is needed for the worker typecheck.
      - name: Install worker dev deps
        run: bun install --frozen-lockfile
        working-directory: worker
      - name: Type check site
        # Use the workspace-local binaries to guarantee the pinned
        # typescript version (5.9.3). astro sync generates the
        # .astro/types.d.ts needed by tsc for astro:content and
        # ImportMeta.env types.
        run: |
          ./node_modules/.bin/astro sync
          ./node_modules/.bin/tsc --noEmit
        working-directory: apps/site
      - name: Type check worker
        run: ./node_modules/.bin/tsc --noEmit
        working-directory: worker

  unit:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    needs: [format, typecheck]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun 1.3.11
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.11"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit + property tests with coverage
        run: bunx vitest run --coverage --pool=forks
      - name: Generate JUnit report
        if: always()
        run: bunx vitest run --no-coverage --reporter=junit --outputFile=reports/junit.xml --pool=forks
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/
          retention-days: 7

  wasm:
    name: Build WASM Widgets
    runs-on: ubuntu-latest
    needs: [unit]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/widgets
      - name: Install wasm-pack
        run: |
          curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh \
            | sh -s -- --force
      - name: Install Bun 1.3.11
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.11"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build WASM (and stage into apps/site/public/wasm)
        run: bash packages/widgets/scripts/build.sh
      - name: Verify WASM output
        run: |
          test -f packages/widgets/pkg/hydrated_widgets_bg.wasm
          test -f apps/site/public/wasm/hydrated_widgets_bg.wasm
      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-dist
          path: apps/site/public/wasm/
          retention-days: 1

  site:
    name: Build Astro Site
    runs-on: ubuntu-latest
    needs: [unit]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun 1.3.11
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.11"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build Astro site
        run: bunx astro build
        working-directory: apps/site
      - name: Verify build output
        run: |
          test -d apps/site/dist
          test -f apps/site/dist/index.html
      - name: Cache site build
        uses: actions/cache@v4
        with:
          path: apps/site/dist
          key: site-${{ hashFiles('apps/site/src/**') }}-${{ github.sha }}

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [wasm, site]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun 1.3.11
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.11"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download WASM dist
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: apps/site/public/wasm
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Run E2E tests
        run: bunx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [e2e]
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun 1.3.11
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.11"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Lighthouse CI
        run: bunx --yes @lhci/cli@0.15.x autorun --config=lighthouserc.json
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-reports/
          retention-days: 7

  npm-audit:
    name: Bun Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun 1.3.11
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.11"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # bun audit exits non-zero on advisories at or above the configured level.
      - name: Run bun audit (high+ severity)
        run: bun audit --level high || true

  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true
      - name: Run cargo audit
        run: cargo audit --file packages/widgets/Cargo.lock || true
