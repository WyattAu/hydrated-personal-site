name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref. Keep one ongoing on main to avoid
# flapping artefact states during chained pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  format:
    name: Biome Format & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@735343b667d3e6bfb3dd40e3b1db06b07838c21e
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format & lint check
        run: bunx biome check .

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@735343b667d3e6bfb3dd40e3b1db06b07838c21e
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Cloudflare workers-types is needed for the worker typecheck.
      - name: Install worker dev deps
        run: bun install --frozen-lockfile
        working-directory: worker
      - name: Type check site
        run: bunx tsc --noEmit -p apps/site/tsconfig.json
      - name: Type check worker
        run: bunx tsc --noEmit -p worker/tsconfig.json

  unit:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    needs: [format, typecheck]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@735343b667d3e6bfb3dd40e3b1db06b07838c21e
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit + property tests with coverage
        run: bunx vitest run --coverage --pool=forks
      - name: Generate JUnit report
        if: always()
        run: bunx vitest run --no-coverage --reporter=junit --outputFile=reports/junit.xml --pool=forks
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: test-results
          path: reports/
          retention-days: 7

  wasm:
    name: Build WASM Widgets
    runs-on: ubuntu-latest
    needs: [unit]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@00901f5853516d291e59569dd1a3af3c60828eba
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@9d401a67e2a3e761b73f17dd3f36ee6b0404091e
        with:
          workspaces: packages/widgets
      - name: Install wasm-pack
        run: |
          curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh \
            | sh -s -- --force
      - name: Build WASM (and stage into apps/site/public/wasm)
        run: bash packages/widgets/scripts/build.sh
      - name: Verify WASM output
        run: |
          test -f packages/widgets/pkg/hydrated_widgets_bg.wasm
          test -f apps/site/public/wasm/hydrated_widgets_bg.wasm
      - name: Upload WASM artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: wasm-dist
          path: apps/site/public/wasm/
          retention-days: 1

  site:
    name: Build Astro Site
    runs-on: ubuntu-latest
    needs: [unit]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@735343b667d3e6bfb3dd40e3b1db06b07838c21e
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build Astro site
        run: bunx astro build
        working-directory: apps/site
      - name: Verify build output
        run: |
          test -d apps/site/dist
          test -f apps/site/dist/index.html
      - name: Cache site build
        uses: actions/cache@6849a6489940f00c2f30c5fb15cdc015f340f7ac
        with:
          path: apps/site/dist
          key: site-${{ hashFiles('apps/site/src/**') }}-${{ github.sha }}

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [wasm, site]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@735343b667d3e6bfb3dd40e3b1db06b07838c21e
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download WASM dist
        uses: actions/download-artifact@fa0a91b85d4f404e4f1e47a5a4d7ac0b9e6d724b
        with:
          name: wasm-dist
          path: apps/site/public/wasm
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Run E2E tests
        run: bunx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [e2e]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@735343b667d3e6bfb3dd40e3b1db06b07838c21e
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Lighthouse CI
        run: bunx --yes @lhci/cli@0.15.x autorun --config=lighthouserc.json
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: lighthouse-report
          path: lighthouse-reports/
          retention-days: 7

  npm-audit:
    name: Bun Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@735343b667d3e6bfb3dd40e3b1db06b07838c21e
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # bun audit exits non-zero on advisories at or above the configured level.
      - name: Run bun audit (high+ severity)
        run: bun audit --level high || true

  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@00901f5853516d291e59569dd1a3af3c60828eba
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
