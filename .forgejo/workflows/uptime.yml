name: Uptime Check

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  probe:
    name: HTTP Probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: Homepage
            url: https://wyattau.com/
          - name: API Health
            url: https://wyattau.com/api/health
          - name: Crypto Ticker
            url: https://wyattau.com/api/crypto-ticker
          - name: World Monitor
            url: https://wyattau.com/world
          - name: ETF Page
            url: https://wyattau.com/etf
    steps:
      - name: Check ${{ matrix.check.name }}
        run: |
          for i in 1 2 3; do
            # -L follows redirects (Cloudflare issues 308 for trailing-slash normalisation).
            # -o /dev/null discards body. --max-time bounds each attempt.
            status=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 15 "${{ matrix.check.url }}" || true)
            if [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
              echo "${{ matrix.check.name }}: OK (HTTP $status)"
              exit 0
            fi
            echo "Attempt $i failed (HTTP $status), retrying in 30s..."
            sleep 30
          done
          echo "${{ matrix.check.name }}: FAILED after 3 attempts"
          exit 1

  static:
    name: Static Asset Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        asset:
          - name: Favicon
            url: https://wyattau.com/favicon.svg
          - name: robots.txt
            url: https://wyattau.com/robots.txt
          - name: Sitemap
            url: https://wyattau.com/sitemap-index.xml
    steps:
      - name: Check ${{ matrix.asset.name }}
        run: |
          for i in 1 2 3; do
            status=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 15 "${{ matrix.asset.url }}" || true)
            if [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
              echo "${{ matrix.asset.name }}: OK (HTTP $status)"
              exit 0
            fi
            echo "Attempt $i failed (HTTP $status), retrying in 30s..."
            sleep 30
          done
          echo "${{ matrix.asset.name }}: FAILED after 3 attempts"
          exit 1

  api-health:
    name: API Endpoint Health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        endpoint:
          - name: Health
            path: /api/health
          - name: Crypto Ticker
            path: /api/crypto-ticker
          - name: Stock Chart (AAPL)
            path: /api/stock-chart?symbol=AAPL&range=1d
          - name: Earthquakes
            path: /api/earthquakes
          - name: Fear & Greed
            path: /api/fear-greed
          - name: Hacker News
            path: /api/hacker-news
          - name: Weather (Hong Kong)
            # Open-Meteo takes ?lat=&lon= (not lng=).
            path: /api/weather?lat=22.32&lon=114.17
          - name: Exchange Rates
            path: /api/exchange-rates
    steps:
      - name: Check ${{ matrix.endpoint.name }}
        run: |
          for i in 1 2 3; do
            status=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 15 "https://wyattau.com${{ matrix.endpoint.path }}" || true)
            # 2xx = healthy, 400 = upstream rejected our request as invalid
            # (still means the worker is alive and responding sensibly).
            if [ "$status" -eq 200 ] || [ "$status" -eq 400 ]; then
              echo "${{ matrix.endpoint.name }}: OK (HTTP $status)"
              exit 0
            fi
            echo "Attempt $i failed (HTTP $status), retrying in 30s..."
            sleep 30
          done
          echo "${{ matrix.endpoint.name }}: FAILED after 3 attempts"
          exit 1
